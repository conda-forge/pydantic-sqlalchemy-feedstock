{% set name = "pydantic-sqlalchemy" %}
{% set version = "0.0.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4f44afbe6e38d601d325a8f74d9b9a0d3922634570378701e16019afa62f48a3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }},<4.0
    - sqlalchemy >=1.3.16,<2.0.0
    - pydantic >=1.5.1,<2.0.0

test:
  imports:
    - pydantic_sqlalchemy
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/tiangolo/pydantic-sqlalchemy
  summary: Tools to convert SQLAlchemy models to Pydantic models
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
