# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.10"

package:
  name: pydantic-sqlalchemy
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydantic-sqlalchemy/pydantic_sqlalchemy-${{ version }}.tar.gz
  sha256: 4f44afbe6e38d601d325a8f74d9b9a0d3922634570378701e16019afa62f48a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pdm-backend
  run:
    - python >=${{ python_min }}
    - sqlalchemy <2.0.0,>=1.3.16
    - pydantic <2.0.0,>=1.5.1

tests:
  - python:
      imports:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/tiangolo/pydantic-sqlalchemy
  license: MIT
  license_file: LICENSE
  summary: Tools to convert SQLAlchemy models to Pydantic models
  description: |
    Tools to convert SQLAlchemy models to Pydantic models
  repository: https://github.com/tiangolo/pydantic-sqlalchemy

extra:
  recipe-maintainers:
    - REPLACE_MAINTAINER
